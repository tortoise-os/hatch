name: Deploy to Mainnet

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "deploy-to-mainnet" to confirm'
        required: true
        type: string

env:
  NETWORK: mainnet

jobs:
  validation:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "deploy-to-mainnet" ]; then
            echo "❌ Invalid confirmation. Please type 'deploy-to-mainnet' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated"

  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Install Sui CLI
        run: |
          cargo install --locked --git https://github.com/MystenLabs/sui.git --branch mainnet sui

      - name: Build Move contracts
        run: cd move && sui move build

      - name: Run all tests
        run: cd move && sui move test

      - name: Security audit (must pass)
        run: bun audit

      - name: Run comprehensive pre-deployment check
        run: bun run scripts/pre-deployment-check.ts mainnet

      - name: Validate mainnet configuration
        run: bun run scripts/validate-config.ts mainnet

  deploy:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment:
      name: mainnet
      url: https://suivision.xyz
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Install Sui CLI
        run: |
          cargo install --locked --git https://github.com/MystenLabs/sui.git --branch mainnet sui

      - name: Configure Sui client
        env:
          SUI_PRIVATE_KEY: ${{ secrets.SUI_MAINNET_PRIVATE_KEY }}
        run: |
          sui client active-env
          sui client switch --env mainnet

      - name: Create deployment backup
        run: |
          if [ -f "deployments/mainnet.json" ]; then
            cp deployments/mainnet.json "deployments/mainnet.$(date +%s).backup.json"
            echo "✅ Backup created"
          fi

      - name: Deploy contracts
        env:
          SUI_PRIVATE_KEY: ${{ secrets.SUI_MAINNET_PRIVATE_KEY }}
        run: bun run scripts/deploy.ts mainnet

      - name: Verify deployment
        run: bun run scripts/verify-deployment.ts mainnet

      - name: Run health check
        run: bun run scripts/health-check.ts mainnet

      - name: Save deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-deployment
          path: |
            deployments/mainnet.json
            deployments/mainnet.*.backup.json

      - name: Create Git tag
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          git tag -a "mainnet-$VERSION" -m "Mainnet deployment $VERSION"
          git push origin "mainnet-$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-pools:
    name: Create Flash Pools
    runs-on: ubuntu-latest
    needs: deploy
    environment: mainnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Install Sui CLI
        run: |
          cargo install --locked --git https://github.com/MystenLabs/sui.git --branch mainnet sui

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: mainnet-deployment
          path: deployments/

      - name: Create flash pools
        env:
          SUI_PRIVATE_KEY: ${{ secrets.SUI_MAINNET_PRIVATE_KEY }}
        run: bun run scripts/create-all-pools.ts mainnet

      - name: Verify pools
        run: bun run scripts/list-pools.ts mainnet

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy, create-pools]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy.result == 'success' && needs.create-pools.result == 'success'
        run: |
          echo "✅ MAINNET DEPLOYMENT SUCCESSFUL!"
          echo "Package deployed and pools created"
          # Add critical notification here (PagerDuty, Slack, etc.)

      - name: Notify failure
        if: needs.deploy.result == 'failure' || needs.create-pools.result == 'failure'
        run: |
          echo "❌ MAINNET DEPLOYMENT FAILED!"
          # Add critical alert here
          exit 1
