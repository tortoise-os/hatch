name: Deploy to Testnet

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        type: boolean
        default: false

env:
  NETWORK: testnet

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Sui CLI
        run: |
          cargo install --locked --git https://github.com/MystenLabs/sui.git --branch mainnet sui

      - name: Build Move contracts
        run: cd move && sui move build

      - name: Run Move tests
        if: ${{ !inputs.skip_tests }}
        run: cd move && sui move test

      - name: Run TypeScript tests
        if: ${{ !inputs.skip_tests }}
        run: bun test

      - name: Security audit
        run: bun audit
        continue-on-error: true

      - name: Validate configuration
        run: bun run scripts/validate-config.ts testnet

  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: testnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Install Sui CLI
        run: |
          cargo install --locked --git https://github.com/MystenLabs/sui.git --branch mainnet sui

      - name: Configure Sui client
        env:
          SUI_PRIVATE_KEY: ${{ secrets.SUI_TESTNET_PRIVATE_KEY }}
        run: |
          sui client active-env
          sui client switch --env testnet

      - name: Deploy contracts
        env:
          SUI_PRIVATE_KEY: ${{ secrets.SUI_TESTNET_PRIVATE_KEY }}
        run: bun run scripts/deploy.ts testnet

      - name: Verify deployment
        run: bun run scripts/verify-deployment.ts testnet

      - name: Create flash pools
        env:
          SUI_PRIVATE_KEY: ${{ secrets.SUI_TESTNET_PRIVATE_KEY }}
        run: bun run scripts/create-all-pools.ts testnet
        continue-on-error: true

      - name: Run health check
        run: bun run scripts/health-check.ts testnet

      - name: Save deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment
          path: |
            deployments/testnet.json
            deployments/testnet-pools.json

      - name: Create deployment summary
        run: |
          echo "## Testnet Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** Testnet" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Information" >> $GITHUB_STEP_SUMMARY
          bun run scripts/deployment-status.ts >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Testnet deployment successful!"
          # Add Slack/Discord notification here

      - name: Notify failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Testnet deployment failed!"
          # Add Slack/Discord notification here
